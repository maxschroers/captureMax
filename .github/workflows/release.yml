name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build exe
        run: pyinstaller --onefile --windowed --name captureMax --icon assets/icon.ico --add-data "assets;assets" capturemax.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/captureMax.exe --title "captureMax ${{ github.ref_name }}" --generate-notes
